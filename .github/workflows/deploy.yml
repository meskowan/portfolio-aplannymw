
name: Deploy Aplannymw Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCqBDu1lA4nxvixR22dqee4U6u7Knc7pMA"
          VITE_FIREBASE_AUTH_DOMAIN: "portfolio-aplannymw.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "portfolio-aplannymw"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "897665306104"
          VITE_FIREBASE_APP_ID: "1:897665306104:web:c397b46c94ee5d0af61a0d"
          VITE_ADMIN_EMAIL: "mendinuswandik918@gmail.com"

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
